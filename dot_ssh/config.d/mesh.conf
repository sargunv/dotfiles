# Shared SSH mesh across Sargun's T3 machines (resolved via Tailscale MagicDNS).
# To add a new machine: add its public key to .chezmoidata/ssh_keys.yml and a Host block here.

Host optiplex
  HostName optiplex
  User sargunv

Host mbp sarguns-macbook-pro
  HostName sarguns-macbook-pro
  User sargunv

Host mac-mini mini sarguns-mac-mini
  HostName sarguns-mac-mini
  User sargunv

Host fw-desktop
  HostName fw-desktop
  User sargunv

Host surface sargunv-surface
  HostName sargunv-surface
  User sargu
