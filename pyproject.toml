[project]
name = "dotfiles-tooling"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false
exclude-newer = "3 days"
python-preference = "only-system" # Use the interpreter provided by mise.

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"] # Line wrapping belongs to dprint's Ruff formatter.

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "ty==0.0.77",
]
