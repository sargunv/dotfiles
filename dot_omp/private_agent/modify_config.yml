# chezmoi:modify-template
{{/* Merge startup routing and starting model roles; OMP owns other preferences and roles you change. */}}
{{- $config := .chezmoi.stdin | default "{}" | fromYaml -}}
{{- /* OMP's Go model ids carry the gateway prefix. */ -}}
{{- $smol := printf "opencode-go/%s%s" .ai.goPrefix (.ai.opencode.smallModel | trimPrefix "opencode-go/") -}}
{{- range $role, $model := dict "default" (printf "openai/%s" .ai.openai.defaultModel) "smol" $smol "tiny" "@smol" -}}
{{- if not (dig "modelRoles" $role "" $config) -}}
{{- $config = $config | setValueAtPath (printf "modelRoles.%s" $role) $model -}}
{{- end -}}
{{- end -}}
{{- $config = $config | setValueAtPath "enabledModels" (list "openai/*" "opencode-go/*" "xai/*") -}}
{{ $config | toYaml }}
