# https://mise.jdx.dev
# Pins repo-local tooling for formatting and pre-commit checks.

[settings]
experimental = true
pin = true
lockfile = true
# mise 2026.10.19 rebuilds every platform by default and fails when a tool
# has no asset for one of them. Merge keeps existing entries. Lock only
# linux-x64, linux-arm64, macos-arm64, windows-x64, and windows-arm64 —
# not musl or Intel Mac. aqua:jdx/hk has no musl variant; use github:jdx/hk
# only when musl platforms are locked.
# https://github.com/jdx/mise/releases/tag/v2026.10.19
lockfile_mode = "merge"

[tools]
"aqua:jdx/hk" = "2.11.1"
"aqua:dprint/dprint" = "0.64.3"

[hooks]
postinstall = ["hk install --mise --quiet"]

[tasks.check]
description = "Run formatting and lint checks"
run = "hk check --all"

[tasks.fix]
description = "Auto-fix formatting issues"
run = "hk fix --all"
