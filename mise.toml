# https://mise.jdx.dev
# Pins repo-local tooling for formatting, linting, and tests.

[settings]
experimental = true
pin = true
lockfile = true

[tools]
# Aqua's hk recipe hardcodes unknown-linux-gnu (no musl variant). GitHub
# release matching picks the musl tarball on linux-*-musl. matching_regex
# excludes the Pkl package zip (hk@<ver>.zip), which is not a binary.
"github:jdx/hk" = { version = "1.46.0", matching_regex = "unknown-linux|apple-darwin|pc-windows" }
"aqua:apple/pkl" = "0.31.1"
"aqua:dprint/dprint" = "0.54.0"
"core:python" = "3.14.7"
"aqua:astral-sh/uv" = "0.12.9"

[hooks]
postinstall = ["hk install --mise --quiet"]

[tasks.check]
description = "Run formatting and lint checks"
run = "hk check --all"

[tasks.fix]
description = "Auto-fix formatting issues"
run = "hk fix --all"

[settings.python]
uv_venv_auto = "create|source"

[deps.uv]
auto = true

[tasks.test]
description = "Run Python script regression tests"
run = "uv run --locked python -B -m unittest discover -s dot_agents/skills/babysit-pr/scripts -v"
